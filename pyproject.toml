[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcsa"
version = "0.1.0"
description = "Dynamic Composable Sparse Attention research repository"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["dcsa*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
